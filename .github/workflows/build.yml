name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # Keras -> TFLite runs once, on Linux: TensorFlow ships no Intel macOS
  # wheels past 2.16, and one conversion means every OS embeds the same bytes.
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - run: make models

      - name: Model hashes
        run: md5sum build/models/*

      - uses: actions/upload-artifact@v7
        with:
          name: models
          path: build/models/
          retention-days: 7


  build:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 is AlmaLinux 8: binaries built against its
          # glibc 2.28 run on nearly every current distribution, where
          # ubuntu-24.04's headers pull in glibc 2.38 symbols. Pinned like
          # TFLM, so the compiler can't change under the cache
          - os: linux
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.30-1
            shell: bash
          - os: macos
            runner: macos-15-intel
            shell: bash
          - os: windows
            runner: windows-latest
            shell: msys2 {0}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Without this the binaries require the runner's own macOS version
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows'
        with:
          msystem: UCRT64
          update: true
          # UCRT64 rather than MINGW64: its printf handles the %zu that
          # pipeline_init writes arena_used_bytes with. Native Python, not
          # MSYS's, because that is the one with numpy and Pillow packages
          install: >-
            make git wget unzip patch zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow

      - name: Tools and Python in manylinux
        if: matrix.os == 'linux'
        run: |
          dnf install -y wget unzip zip patch git
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7
        if: matrix.os == 'macos'
        with:
          python-version: '3.12'

      # TFLM's Makefile runs generate_cc_arrays.py on its examples and tests
      # while parsing, even to build only the library
      - name: numpy and Pillow for TFLM
        if: matrix.os != 'windows'
        run: pip install numpy pillow

      # macOS ships GNU make 3.81 and TFLM needs 3.82+
      - name: GNU make and wget for TFLM
        if: matrix.os == 'macos'
        run: |
          brew install make wget
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: models
          path: build/models

      - name: Compiler version
        id: cc
        run: echo "version=$(g++ --version | head -1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache TFLite Micro
        id: tflm
        uses: actions/cache@v6
        with:
          path: deps/tflite-micro
          key: tflm-${{ matrix.os }}-${{ hashFiles('install.sh') }}-${{ steps.cc.outputs.version }}

      - name: Build TFLite Micro
        if: steps.tflm.outputs.cache-hit != 'true'
        run: ./install.sh

      - run: make baseline variable surface prhpredict

      - name: Check glibc and runtime linkage
        if: matrix.os == 'linux'
        run: |
          bins="build/baseline build/variable build/surface build/prhpredict"
          objdump -p $bins | grep NEEDED | sort | uniq -c
          if objdump -p $bins | grep -E 'NEEDED.*(libstdc\+\+|libgcc_s)'; then
            echo "libstdc++ or libgcc is linked dynamically"; exit 1
          fi
          max=$(objdump -T $bins | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          [ "$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ]

      # Apple's x86_64 linker does not ad-hoc sign the way the arm64 one does.
      # Signing doesn't lift the quarantine on a browser-downloaded zip, but an
      # unsigned binary won't run even once that is cleared
      - name: Ad-hoc sign
        if: matrix.os == 'macos'
        run: |
          codesign -s - -f build/baseline build/variable build/surface build/prhpredict
          codesign -v build/baseline build/variable build/surface build/prhpredict

      - run: python3 tools/smoke_test.py build

      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/rotateai-pipelines-${{ matrix.os }}-x86_64.zip \
            build/baseline* build/variable* build/surface* build/prhpredict*

      # archive: false uploads the zip as-is instead of zipping it again
      - uses: actions/upload-artifact@v7
        with:
          path: dist/rotateai-pipelines-${{ matrix.os }}-x86_64.zip
          archive: false


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rotateai-pipelines-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --generate-notes
