name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # Keras -> TFLite runs once, on Linux: TensorFlow ships no Intel macOS
  # wheels past 2.16, and one conversion means every OS embeds the same bytes.
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - run: make models

      - name: Model hashes
        run: md5sum build/models/*

      - uses: actions/upload-artifact@v7
        with:
          name: models
          path: build/models/
          retention-days: 7


  build:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            shell: bash
          - os: macos
            runner: macos-15-intel
            shell: bash
          - os: windows
            runner: windows-latest
            shell: msys2 {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      # Without this the binaries require the runner's own macOS version
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: msys2/setup-msys2@v2
        if: matrix.os == 'windows'
        with:
          msystem: UCRT64
          update: true
          # UCRT64 rather than MINGW64: its printf handles the %zu that
          # pipeline_init writes arena_used_bytes with
          install: >-
            make git wget unzip patch zip python
            mingw-w64-ucrt-x86_64-gcc

      - name: wget for TFLM downloads
        if: matrix.os == 'macos'
        run: command -v wget || brew install wget

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: models
          path: build/models

      - name: Compiler version
        id: cc
        run: echo "version=$(g++ --version | head -1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache TFLite Micro
        id: tflm
        uses: actions/cache@v6
        with:
          path: deps/tflite-micro
          key: tflm-${{ matrix.os }}-${{ hashFiles('install.sh') }}-${{ steps.cc.outputs.version }}

      - name: Build TFLite Micro
        if: steps.tflm.outputs.cache-hit != 'true'
        run: ./install.sh

      - run: make baseline variable surface prhpredict

      # Apple's x86_64 linker does not ad-hoc sign the way the arm64 one does.
      # Signing doesn't lift the quarantine on a browser-downloaded zip, but an
      # unsigned binary won't run even once that is cleared
      - name: Ad-hoc sign
        if: matrix.os == 'macos'
        run: |
          codesign -s - -f build/baseline build/variable build/surface build/prhpredict
          codesign -v build/baseline build/variable build/surface build/prhpredict

      - run: python3 tools/smoke_test.py build

      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/rotateai-pipelines-${{ matrix.os }}-x86_64.zip \
            build/baseline* build/variable* build/surface* build/prhpredict*

      # archive: false uploads the zip as-is instead of zipping it again
      - uses: actions/upload-artifact@v7
        with:
          path: dist/rotateai-pipelines-${{ matrix.os }}-x86_64.zip
          archive: false


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rotateai-pipelines-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --generate-notes
